name: nnserver Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach to (default: latest)'
        required: false
        default: latest

permissions:
  contents: write

jobs:
  nnserver-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-make zip mingw-w64-x86_64-vulkan-headers mingw-w64-x86_64-vulkan-loader mingw-w64-x86_64-spirv-headers mingw-w64-x86_64-shaderc

      # Remove prebuilt .a so FetchContent builds from source (CI GCC may differ)
      - name: Prepare
        shell: msys2 {0}
        run: rm -f NNModelServer/sd-build/win64/*.a

      - name: Configure
        shell: msys2 {0}
        working-directory: NNModelServer
        run: cmake -B ../build/nnserver -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_MAKE_PROGRAM=mingw32-make

      - name: Build nnserver
        shell: msys2 {0}
        run: cmake --build build/nnserver --parallel -j $(nproc)

      - name: Package
        shell: msys2 {0}
        run: |
          mkdir -p dist/nnserver-windows
          cp build/nnserver/bin/nnserver.exe dist/nnserver-windows/
          cp build/nnserver/bin/onnxruntime.dll dist/nnserver-windows/
          cp build/nnserver/bin/model_url.txt dist/nnserver-windows/
          cp "$MINGW_PREFIX/bin/libgomp-1.dll"        dist/nnserver-windows/ 2>/dev/null || true
          cp "$MINGW_PREFIX/bin/libwinpthread-1.dll"  dist/nnserver-windows/ 2>/dev/null || true
          cp "$MINGW_PREFIX/bin/libgcc_s_seh-1.dll"   dist/nnserver-windows/ 2>/dev/null || true
          cp "$MINGW_PREFIX/bin/libstdc++-6.dll"       dist/nnserver-windows/ 2>/dev/null || true
          cp "$MINGW_PREFIX/bin/vulkan-1.dll"          dist/nnserver-windows/ 2>/dev/null || true
          cd dist && zip -r ../nnserver-windows.zip nnserver-windows

      - uses: actions/upload-artifact@v4
        with:
          name: nnserver-windows
          path: nnserver-windows.zip

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || 'latest' }}
          name: nnserver ${{ github.event.inputs.tag || 'latest' }}
          prerelease: true
          files: nnserver-windows.zip
          fail_on_unmatched_files: false

  nnserver-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev
          # LunarG repo for glslc (ggml-vulkan requires it)
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/lunarg.gpg
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-noble.list https://packages.lunarg.com/vulkan/lunarg-vulkan-noble.list
          sudo apt-get update
          sudo apt-get install -y shaderc libvulkan-dev

      - name: Configure
        working-directory: NNModelServer
        run: cmake -B ../build/nnserver -DCMAKE_BUILD_TYPE=Release

      - name: Build nnserver
        run: cmake --build build/nnserver --parallel

      - name: Package
        run: |
          mkdir -p dist/nnserver-linux
          cp build/nnserver/bin/nnserver dist/nnserver-linux/ 2>/dev/null || true
          cp build/nnserver/bin/model_url.txt dist/nnserver-linux/ 2>/dev/null || true
          cp build/nnserver/onnxruntime/lib/libonnxruntime.so* dist/nnserver-linux/ 2>/dev/null || true
          cd dist && zip -r ../nnserver-linux.zip nnserver-linux

      - uses: actions/upload-artifact@v4
        with:
          name: nnserver-linux
          path: nnserver-linux.zip

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || 'latest' }}
          name: nnserver ${{ github.event.inputs.tag || 'latest' }}
          prerelease: true
          files: nnserver-linux.zip
          fail_on_unmatched_files: false
