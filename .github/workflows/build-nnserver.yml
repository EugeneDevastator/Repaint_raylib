name: Build NNServer

on:
  push:
    branches: ["**"]
    paths:
      - 'NNModelServer/**'
      - '.github/workflows/build-nnserver.yml'

jobs:
  build-nnserver-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache nnserver bootstrap
        id: cache
        uses: actions/cache@v4
        with:
          path: dist-server
          key: nnserver-linux-${{ hashFiles('NNModelServer/**') }}

      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -ex

          # Pin exact dependency versions
          pip install numpy Pillow torch transformers
          pip freeze | grep -iv '^pip=\|^setuptools=\|^wheel=\|^-e ' > NNModelServer/requirements.txt

          # Download portable Python (python-build-standalone ~30MB)
          curl -sL "https://github.com/astral-sh/python-build-standalone/releases/download/20250115/cpython-3.11.11+20250115-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz" -o python.tar.gz
          mkdir -p pyextract
          tar -xzf python.tar.gz -C pyextract
          cd pyextract
          topdir="$(ls -A | head -1)"
          if [ "$topdir" != "python" ]; then mv "$topdir" python; fi
          # Bootstrap pip (install_only_stripped doesn't include pip)
          python/bin/python3 -m ensurepip --upgrade 2>/dev/null || true
          zip -r ../python.zip python
          cd ..
          rm -rf pyextract python.tar.gz

          # Build bootstrap (stdlib only — numpy/torch etc excluded)
          pip install pyinstaller
          pyinstaller --onefile NNModelServer/nnserver_bootstrap.py --name nnserver \
            --add-data python.zip:. \
            --add-data NNModelServer/requirements.txt:. \
            --exclude-module numpy --exclude-module PIL --exclude-module torch \
            --exclude-module transformers --exclude-module huggingface_hub \
            --exclude-module matplotlib --exclude-module scipy --exclude-module sympy \
            --exclude-module pandas --exclude-module tkinter
          rm -rf python.zip

          mkdir -p dist-server
          cp dist/nnserver dist-server/
          cp NNModelServer/nnserver_core.py dist-server/

      - name: Package
        run: zip -r nnserver-linux.zip dist-server

      - uses: actions/upload-artifact@v4
        with:
          name: nnserver-linux
          path: nnserver-linux.zip

  build-nnserver-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache nnserver bootstrap
        id: cache
        uses: actions/cache@v4
        with:
          path: dist-server
          key: nnserver-windows-${{ hashFiles('NNModelServer/**') }}

      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -ex

          # Pin exact dependency versions
          pip install numpy Pillow torch transformers
          pip freeze | grep -iv '^pip=\|^setuptools=\|^wheel=\|^-e ' > NNModelServer/requirements.txt

          # Download portable Python
          curl -sL "https://github.com/astral-sh/python-build-standalone/releases/download/20250115/cpython-3.11.11+20250115-x86_64-pc-windows-msvc-shared-install_only_stripped.tar.gz" -o python.tar.gz
          mkdir -p pyextract
          tar -xzf python.tar.gz -C pyextract
          cd pyextract
          topdir="$(ls -A | head -1)"
          if [ "$topdir" != "python" ]; then mv "$topdir" python; fi
          # Bootstrap pip
          python/python.exe -m ensurepip --upgrade 2>/dev/null || true
          python -c "import shutil; shutil.make_archive('../python', 'zip', 'python')"
          cd ..
          rm -rf pyextract python.tar.gz

          # Build bootstrap
          pip install pyinstaller
          pyinstaller --onefile NNModelServer/nnserver_bootstrap.py --name nnserver \
            --add-data python.zip:. \
            --add-data NNModelServer/requirements.txt:. \
            --exclude-module numpy --exclude-module PIL --exclude-module torch \
            --exclude-module transformers --exclude-module huggingface_hub \
            --exclude-module matplotlib --exclude-module scipy --exclude-module sympy \
            --exclude-module pandas --exclude-module tkinter
          rm -rf python.zip

          mkdir -p dist-server
          cp dist/nnserver.exe dist-server/
          cp NNModelServer/nnserver_core.py dist-server/

      - name: Package
        shell: powershell
        run: |
          Compress-Archive -Path dist-server -DestinationPath nnserver-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: nnserver-windows
          path: nnserver-windows.zip

  build-nnserver-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache nnserver bootstrap
        id: cache
        uses: actions/cache@v4
        with:
          path: dist-server
          key: nnserver-mac-${{ hashFiles('NNModelServer/**') }}

      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -ex

          # Pin exact dependency versions
          pip install numpy Pillow torch transformers
          pip freeze | grep -iv '^pip=\|^setuptools=\|^wheel=\|^-e ' > NNModelServer/requirements.txt

          # Detect arch for the right Python build
          ARCH=$(uname -m)
          if [ "$ARCH" = "arm64" ]; then
            TRIPLE="aarch64-apple-darwin"
          else
            TRIPLE="x86_64-apple-darwin"
          fi

          curl -sL "https://github.com/astral-sh/python-build-standalone/releases/download/20250115/cpython-3.11.11+20250115-${TRIPLE}-install_only_stripped.tar.gz" -o python.tar.gz
          mkdir -p pyextract
          tar -xzf python.tar.gz -C pyextract
          cd pyextract
          topdir="$(ls -A | head -1)"
          if [ "$topdir" != "python" ]; then mv "$topdir" python; fi
          # Bootstrap pip
          python/bin/python3 -m ensurepip --upgrade 2>/dev/null || true
          zip -r ../python.zip python
          cd ..
          rm -rf pyextract python.tar.gz

          pip install pyinstaller
          pyinstaller --onefile NNModelServer/nnserver_bootstrap.py --name nnserver \
            --add-data python.zip:. \
            --add-data NNModelServer/requirements.txt:. \
            --exclude-module numpy --exclude-module PIL --exclude-module torch \
            --exclude-module transformers --exclude-module huggingface_hub \
            --exclude-module matplotlib --exclude-module scipy --exclude-module sympy \
            --exclude-module pandas --exclude-module tkinter
          rm -rf python.zip

          mkdir -p dist-server
          cp dist/nnserver dist-server/
          cp NNModelServer/nnserver_core.py dist-server/

      - name: Package
        run: zip -r nnserver-mac.zip dist-server

      - uses: actions/upload-artifact@v4
        with:
          name: nnserver-mac
          path: nnserver-mac.zip
