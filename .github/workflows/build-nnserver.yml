name: Build NNServer

on:
  push:
    branches: ["**"]
    paths:
      - 'NNModelServer/**'
      - '.github/workflows/build-nnserver.yml'

jobs:
  build-nnserver-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache nnserver binary
        id: cache-nnserver
        uses: actions/cache@v4
        with:
          path: dist-server
          key: nnserver-linux-${{ hashFiles('NNModelServer/**') }}

      - name: Build
        if: steps.cache-nnserver.outputs.cache-hit != 'true'
        run: |
          pip install pyinstaller numpy Pillow torch transformers
          pyinstaller --onefile NNModelServer/nnserver.py --name nnserver
          mkdir -p dist-server
          cp dist/nnserver dist-server/

      - name: Package
        run: |
          zip -r nnserver-linux.zip dist-server

      - uses: actions/upload-artifact@v4
        with:
          name: nnserver-linux
          path: nnserver-linux.zip

  build-nnserver-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache nnserver binary
        id: cache-nnserver
        uses: actions/cache@v4
        with:
          path: dist-server
          key: nnserver-windows-${{ hashFiles('NNModelServer/**') }}

      - name: Build
        if: steps.cache-nnserver.outputs.cache-hit != 'true'
        run: |
          pip install pyinstaller numpy Pillow torch transformers
          pyinstaller --onefile NNModelServer/nnserver.py --name nnserver
          mkdir dist-server
          copy dist\nnserver.exe dist-server\

      - name: Package
        shell: powershell
        run: |
          Compress-Archive -Path dist-server -DestinationPath nnserver-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: nnserver-windows
          path: nnserver-windows.zip

  build-nnserver-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache nnserver binary
        id: cache-nnserver
        uses: actions/cache@v4
        with:
          path: dist-server
          key: nnserver-mac-${{ hashFiles('NNModelServer/**') }}

      - name: Build
        if: steps.cache-nnserver.outputs.cache-hit != 'true'
        run: |
          pip install pyinstaller numpy Pillow torch transformers
          pyinstaller --onefile NNModelServer/nnserver.py --name nnserver
          mkdir -p dist-server
          cp dist/nnserver dist-server/

      - name: Package
        run: |
          zip -r nnserver-mac.zip dist-server

      - uses: actions/upload-artifact@v4
        with:
          name: nnserver-mac
          path: nnserver-mac.zip
