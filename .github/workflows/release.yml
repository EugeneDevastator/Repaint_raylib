name: Release

on:
  workflow_run:
    workflows: ["Build NNServer"]
    branches: [main]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Download repaint-linux
        uses: dawidd6/action-download-artifact@v21
        with:
          workflow: build-app.yml
          branch: main
          name: repaint-linux
          path: _dl/repaint-linux

      - name: Download repaint-windows
        uses: dawidd6/action-download-artifact@v21
        with:
          workflow: build-app.yml
          branch: main
          name: repaint-windows
          path: _dl/repaint-windows

      - name: Download nnserver-linux
        uses: dawidd6/action-download-artifact@v21
        with:
          workflow: build-nnserver.yml
          commit: ${{ github.event.workflow_run.head_sha }}
          name: nnserver-linux
          path: _dl/nnserver-linux

      - name: Download nnserver-windows
        uses: dawidd6/action-download-artifact@v21
        with:
          workflow: build-nnserver.yml
          commit: ${{ github.event.workflow_run.head_sha }}
          name: nnserver-windows
          path: _dl/nnserver-windows

      - name: Download nnserver-mac
        uses: dawidd6/action-download-artifact@v21
        with:
          workflow: build-nnserver.yml
          commit: ${{ github.event.workflow_run.head_sha }}
          name: nnserver-mac
          path: _dl/nnserver-mac

      - name: Bundle repaint-linux-full
        run: |
          out=_out/repaint-linux
          mkdir -p "$out"
          cp -r _dl/repaint-linux/dist/repaint-linux/* "$out/"
          mkdir -p "$out/NNServer"
          cp -r _dl/nnserver-linux/dist-server/* "$out/NNServer/"
          cd _out && zip -r ../repaint-linux-full.zip repaint-linux

      - name: Bundle repaint-windows-full
        run: |
          out=_out/repaint-windows
          mkdir -p "$out"
          cp -r _dl/repaint-windows/dist/repaint-windows/* "$out/"
          mkdir -p "$out/NNServer"
          cp -r _dl/nnserver-windows/dist-server/* "$out/NNServer/"
          cd _out && zip -r ../repaint-windows-full.zip repaint-windows

      - name: Bundle repaint-mac-full
        run: |
          out=_out/repaint-mac
          mkdir -p "$out"
          mkdir -p "$out/NNServer"
          cp -r _dl/nnserver-mac/dist-server/* "$out/NNServer/"
          cd _out && zip -r ../repaint-mac-full.zip repaint-mac

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          prerelease: true
          files: repaint-*-full.zip
