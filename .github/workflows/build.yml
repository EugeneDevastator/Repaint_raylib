name: Build

on:
  push:
    branches: ["**"]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libgl1-mesa-dev

      - name: Configure
        run: cmake --preset linux-release

      - name: Build
        run: cmake --build build/linux-release --parallel

      - name: Package
        run: |
          mkdir -p dist/repaint-linux
          cp build/linux-release/bin/repaint dist/repaint-linux/
          cp -r shaders dist/repaint-linux/ 2>/dev/null || true
          cp -r resources dist/repaint-linux/ 2>/dev/null || true
          zip -r repaint-linux.zip dist/repaint-linux

      - uses: actions/upload-artifact@v4
        with:
          name: repaint-linux
          path: repaint-linux.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-make

      - name: Configure
        shell: msys2 {0}
        run: cmake --preset win64-release -DCMAKE_MAKE_PROGRAM=mingw32-make

      - name: Build
        shell: msys2 {0}
        run: cmake --build build/win64-release --parallel

      - name: Package
        shell: msys2 {0}
        run: |
          mkdir -p dist/repaint-windows
          cp build/win64-release/bin/repaint.exe dist/repaint-windows/
          cp "$MINGW_PREFIX/bin/libwinpthread-1.dll"  dist/repaint-windows/
          cp "$MINGW_PREFIX/bin/libgcc_s_seh-1.dll"   dist/repaint-windows/
          cp "$MINGW_PREFIX/bin/libstdc++-6.dll"       dist/repaint-windows/
          cp -r shaders   dist/repaint-windows/ 2>/dev/null || true
          cp -r resources dist/repaint-windows/ 2>/dev/null || true
          cd dist && zip -r ../repaint-windows.zip repaint-windows

      - uses: actions/upload-artifact@v4
        with:
          name: repaint-windows
          path: repaint-windows.zip

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          prerelease: true
          files: |
            repaint-linux.zip
            repaint-windows.zip